[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "code-review-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [

    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "aiosqlite>=0.20.0",
    "celery[redis]>=5.6.3",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.8.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "structlog>=25.5.0",
    "tenacity>=9.0.0",
    "unidiff>=0.7.5",
    "uvicorn[standard]>=0.48.0",
]



[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.14",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.14",
    "httpx>=0.28.1",
]


[tool.setuptools.packages.find]
include = ["api*", "workers*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
